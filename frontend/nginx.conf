# Serves the built SPA and proxies the API, so the app and its API share one
# origin — which is what lets the SameSite=Lax session cookie be sent. Listens on
# 8080 because the base image (nginx-unprivileged) runs as a non-root user that
# cannot bind 80.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip the text assets; images/fonts are already compressed.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets never change under the same name — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Server-Sent Events stream (realtime). A long-lived streaming response needs
    # different proxy settings than a normal request: HTTP/1.1 with no upstream
    # Connection header, response buffering OFF (otherwise nginx holds the events
    # and the client receives nothing), and a long read timeout so the idle stream
    # is not cut between keepalives. More specific than /api/, so it wins for this
    # path. Without this, SSE works when hitting the backend directly but silently
    # delivers nothing through nginx.
    location /api/events/ {
        proxy_pass http://backend:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # API → backend, same origin from the browser's point of view.
    location /api/ {
        proxy_pass http://backend:5050;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # SPA entry: anything not a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline hardening headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
