<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <link rel ="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" />
    <script>
      // Resolve and apply the theme before first paint so a dark-mode user
      // never sees a flash of light. Mirrors ThemeContext: the stored value is
      // the preference ("light" | "dark" | "system"); "system" (or anything
      // unset) follows the OS.
      (function () {
        try {
          var pref = localStorage.getItem("ems-theme");
          var resolved = (pref === "dark" || pref === "light")
            ? pref
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-bs-theme", resolved);
        } catch (e) { /* localStorage/matchMedia unavailable — light default applies */ }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>

  </body>
</html>
