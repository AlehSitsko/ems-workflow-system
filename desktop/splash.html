<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EMS Workflow System</title>
    <style>
      html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #0d6efd; color: #fff; user-select: none;
      }
      .logo { font-size: 1.5rem; font-weight: 700; letter-spacing: .01em; }
      .sub { margin-top: .35rem; opacity: .85; font-size: .9rem; }
      .spinner {
        margin-top: 1.5rem; width: 34px; height: 34px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.35); border-top-color: #fff;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="logo">EMS Workflow System</div>
    <div class="sub">Starting the local server…</div>
    <div class="spinner"></div>
  </body>
</html>
