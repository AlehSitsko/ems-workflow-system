name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# Non-destructive checks only. Live QA (qa_test.py / stress_test.py) runs against
# a real server and must never run here — it is a local, disposable-database tool.
jobs:
  backend:
    name: Backend (compile + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile all modules
        run: python -m compileall .
      - name: Run pytest (isolated, in-memory SQLite)
        run: pytest -q

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  docker:
    name: Docker (build both dev images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t ems-backend-dev ./backend
      - name: Build frontend image
        run: docker build -t ems-frontend-dev ./frontend
      # Compose is validated rather than started: bringing the stack up would
      # need a database and a wait loop, which belongs in local use, not CI.
      - name: Validate compose file
        run: docker compose config --quiet
