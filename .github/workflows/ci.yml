name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# Non-destructive checks only. Live QA (qa_test.py / stress_test.py) runs against
# a real server and must never run here — it is a local, disposable-database tool.
jobs:
  backend:
    name: Backend (compile + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies (runtime + test toolchain)
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff — correctness gate, see backend/ruff.toml)
        run: ruff check .
      - name: Compile all modules
        run: python -m compileall .
      - name: Run pytest (isolated, in-memory SQLite)
        run: pytest -q

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: E2E (Playwright, disposable backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # A venv at backend/venv is the path playwright.config.js resolves by default
      # (POSIX layout: venv/bin/python). requirements-desktop = runtime deps +
      # waitress, the WSGI server e2e_server.py uses.
      - name: Backend venv + deps
        run: |
          python -m venv backend/venv
          backend/venv/bin/python -m pip install --upgrade pip
          backend/venv/bin/python -m pip install -r backend/requirements-desktop.txt
      - name: Frontend deps + build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      # Playwright's webServer boots e2e_server.py (migrates+seeds a throwaway
      # SQLite DB, serves SPA+API on one loopback origin) and tears it down after.
      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker (build images + prod stack smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend dev image
        run: docker build -t ems-backend-dev ./backend
      - name: Build frontend dev image
        run: docker build -t ems-frontend-dev ./frontend
      - name: Build backend prod image (Gunicorn, non-root)
        run: docker build -f backend/Dockerfile.prod -t ems-backend-prod ./backend
      - name: Build frontend prod image (Nginx, multi-stage)
        run: docker build -f frontend/Dockerfile.prod -t ems-frontend-prod ./frontend
      - name: Validate dev compose file
        run: docker compose config --quiet
      - name: Validate prod compose file
        run: SECRET_KEY=ci-validate POSTGRES_PASSWORD=ci-validate EMS_MASTER_KEY=AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8= BASE_DOMAIN=ems.example.com docker compose -f docker-compose.prod.yml config --quiet
      # Bring the prod stack up for real and prove the whole chain stands:
      # Postgres healthy -> backend runs `flask db upgrade` against Postgres and
      # Gunicorn goes healthy -> Nginx serves the SPA and proxies /api. `--wait`
      # blocks on the healthchecks and fails the job if any never go healthy.
      - name: Prod stack smoke (Postgres + Redis + 3 Gunicorn workers + Nginx + MinIO/S3)
        env:
          SECRET_KEY: ci-smoke-secret-key-not-a-real-secret
          POSTGRES_PASSWORD: ci-smoke-password
          EMS_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          BASE_DOMAIN: ems.example.com
          SESSION_COOKIE_SECURE: "0"  # smoke is plain HTTP, no TLS proxy in front
        run: |
          set -uo pipefail
          # The S3 overlay points object storage at a real MinIO, so this one stack
          # covers migrations + health + realtime AND the S3 document round-trip.
          # 3 workers + EMS_REDIS_URL: without Redis the gunicorn guard refuses to boot.
          COMPOSE="-f docker-compose.prod.yml -f docker-compose.s3-test.yml"
          if ! docker compose $COMPOSE up -d --build --wait --wait-timeout 300; then
            echo "=== stack did not become healthy; diagnostics ==="
            docker compose $COMPOSE ps || true
            docker compose $COMPOSE logs backend --no-color --tail 300 || true
            exit 1
          fi
          # Through Nginx (8080) -> Gunicorn (/api) -> Postgres: the migrated app.
          body=$(curl -sf --retry 5 --retry-delay 3 http://localhost:8080/api/health)
          echo "health: $body"
          echo "$body" | grep -Eq '"status" *: *"ok"'
          curl -sf -o /dev/null http://localhost:8080/   # SPA served at the root
          echo "prod stack smoke OK"

          docker compose $COMPOSE exec -T backend flask --app app seed-demo
          python3 -m pip install --quiet requests

          # Multi-worker realtime: an SSE client must receive an event published while
          # another request is handled by a (likely different) worker — proves the
          # Redis broker fans events across all 3 workers.
          python3 backend/scripts/prod_realtime_smoke.py http://localhost:8080

          # Object storage: a real employee-document upload + download round-trip
          # through S3StorageProvider -> MinIO (not the local filesystem provider).
          python3 backend/scripts/prod_s3_smoke.py http://localhost:8080
      # Real-browser smoke: what `curl /` can't catch — assets returning the wrong
      # MIME type (Vite/Nginx base-path bug), JS module load failures, runtime
      # errors, broken SPA refresh, and realtime not connecting. The prod stack is
      # still up from the step above (detached), listening on 8080.
      - name: Set up Node for the browser smoke
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend deps + Playwright Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Production browser smoke (real Chromium against the prod stack)
        working-directory: frontend
        env:
          PROD_SMOKE_URL: http://localhost:8080/
        run: npx playwright test --config=playwright.prod.config.js
      - name: Upload prod Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod
          path: frontend/playwright-report-prod
          retention-days: 7
      - name: Dump compose logs on failure
        if: failure()
        env:
          SECRET_KEY: ci-smoke-secret-key-not-a-real-secret
          POSTGRES_PASSWORD: ci-smoke-password
          EMS_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          BASE_DOMAIN: ems.example.com
        run: docker compose -f docker-compose.prod.yml -f docker-compose.s3-test.yml logs --no-color --tail 300 || true
      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.s3-test.yml down -v
        env:
          SECRET_KEY: ci-smoke-secret-key-not-a-real-secret
          POSTGRES_PASSWORD: ci-smoke-password
          EMS_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          BASE_DOMAIN: ems.example.com

  desktop:
    name: Desktop (build smoke — Electron + PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The desktop app serves the SPA under /ems-workflow-system/ (the default
      # base), so this is the ordinary build — not the "/" prod/Nginx build.
      - name: Build the frontend SPA
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run build
      # onedir PyInstaller bundle from the spec -> backend/dist/ems-backend/.
      # requirements-desktop = runtime deps + waitress (the desktop WSGI server);
      # PyInstaller is a build-time tool, installed here, not pinned as a runtime dep.
      - name: Package the backend with PyInstaller
        working-directory: backend
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt pyinstaller
          pyinstaller ems-backend.spec
      # --dir packs an unpacked app (no NSIS installer, no code signing) into
      # release/win-unpacked/. electron-builder copies the PyInstaller bundle and
      # the SPA in as extraResources, so this proves the whole desktop assembly
      # links up — including that the models/ package still bundles cleanly.
      - name: Pack the Electron app (electron-builder --dir)
        working-directory: desktop
        shell: bash
        run: |
          npm ci
          npm run pack
      - name: Assert the packaged app bundled the backend + SPA
        working-directory: desktop
        shell: bash
        run: |
          app="release/win-unpacked"
          test -f "$app/EMS Workflow System.exe"           || { echo "electron exe missing";       exit 1; }
          test -f "$app/resources/backend/ems-backend.exe" || { echo "bundled backend exe missing"; exit 1; }
          test -f "$app/resources/frontend/index.html"     || { echo "bundled SPA missing";          exit 1; }
          echo "desktop build smoke OK"
