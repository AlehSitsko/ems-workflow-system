# Automated dependency + base-image updates. This is the supply-chain hardening the
# "pin base-image digests" idea was reaching for, done net-positively: rather than
# freezing images at a digest (which then silently misses security patches), Dependabot
# opens weekly PRs to move them forward — CI (backend/frontend/e2e/docker) gates each one.
# Updates are grouped per ecosystem so it is one reviewable PR a week, not a flood.
# Every ecosystem targets `dev` (target-branch), so dependency PRs land on the
# working branch and reach `main` only through the release PR — never directly.
version: 2
updates:
  # ── Backend Python (requirements.txt / -prod / -desktop) ────────────────────
  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      backend-python:
        patterns: ["*"]

  # ── Frontend + desktop npm ──────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      frontend-npm:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/desktop"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      desktop-npm:
        patterns: ["*"]

  # ── Base images (Dockerfiles + compose FROM/image tags) ─────────────────────
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      backend-images:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      frontend-images:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      compose-images:
        patterns: ["*"]

  # ── GitHub Actions used by the CI workflow ──────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
