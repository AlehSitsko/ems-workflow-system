# Production-style stack: Gunicorn behind an Nginx that serves the built SPA and
# proxies /api, on a PostgreSQL database — all non-root images, source baked in,
# no bind mounts.
#
# Intended to run behind a TLS-terminating proxy. To smoke-test locally over
# plain HTTP, set SESSION_COOKIE_SECURE=0 so the session cookie is actually sent.
#
# Secrets here come from the environment for a one-command local run. For a real
# deployment, mount them as files and point the app at the paths instead —
# SECRET_KEY_FILE / DATABASE_URL_FILE (and Postgres's POSTGRES_PASSWORD_FILE) —
# so the values never sit in the container environment (see config.py._secret).
#
#   SECRET_KEY=$(openssl rand -hex 32) POSTGRES_PASSWORD=$(openssl rand -hex 16) \
#     docker compose -f docker-compose.prod.yml up --build
#
# then open http://localhost:8080. Demo data is never seeded automatically; run
#   docker compose -f docker-compose.prod.yml exec backend flask --app app seed-demo
# (or seed-demo-data) once the stack is healthy.
#
# A distinct project name so the prod images/containers never collide with the
# dev stack's (docker-compose.yml), which would otherwise share the same names
# and silently reuse each other's images.
name: ems-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ems}
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems} -d ${POSTGRES_DB:-ems}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Pub/Sub only (no persistence needed): the realtime broker that fans domain
    # events to every backend worker. See events.py / gunicorn.conf.py.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      EMS_ENV: production
      # Required in production — the app refuses to start without a real key.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY, e.g. openssl rand -hex 32}
      # PostgreSQL (psycopg 3). The migrations run against it on startup.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ems}
      # Realtime broker. With >1 Gunicorn worker this is REQUIRED — the app refuses
      # to boot multi-worker in production without it (gunicorn.conf.py guard).
      EMS_REDIS_URL: ${EMS_REDIS_URL:-redis://redis:6379/0}
      # Worker/thread counts (gunicorn.conf.py reads these).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Field-encryption master key — REQUIRED in production: the app refuses to
      # start without it so sensitive fields (patient member id, policy number,
      # insurance notes) are never silently stored in plaintext. A base64 32-byte
      # key, e.g. `openssl rand -base64 32`; rotate with `v1:<b64>,v2:<b64>`. Mount
      # it as EMS_MASTER_KEY_FILE in a real deployment instead of the environment.
      EMS_MASTER_KEY: ${EMS_MASTER_KEY:?set EMS_MASTER_KEY, e.g. openssl rand -base64 32}
      # Secure (HTTPS-only) cookies by default; set 0 to smoke-test over HTTP.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      # Multi-tenancy: the apex the org subdomains live under, and the host of the
      # cross-org platform console. MUST be set to the real domain — the default is
      # `localhost`, under which no production subdomain would resolve and every
      # org would look like a bare (single-tenant) host. CORS reflects any
      # `*.${BASE_DOMAIN}` origin, so no separate allowlist entry is needed per org.
      BASE_DOMAIN: ${BASE_DOMAIN:?set BASE_DOMAIN, e.g. ems.example.com}
      PLATFORM_HOST: ${PLATFORM_HOST:-admin.${BASE_DOMAIN:-example.com}}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
