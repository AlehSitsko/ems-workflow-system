# Production-style stack: Gunicorn behind an Nginx that serves the built SPA and
# proxies /api, on a PostgreSQL database — all non-root images, source baked in,
# no bind mounts.
#
# Intended to run behind a TLS-terminating proxy. To smoke-test locally over
# plain HTTP, set SESSION_COOKIE_SECURE=0 so the session cookie is actually sent.
#
# Secrets here come from the environment for a one-command local run. For a real
# deployment, mount them as files and point the app at the paths instead —
# SECRET_KEY_FILE / DATABASE_URL_FILE (and Postgres's POSTGRES_PASSWORD_FILE) —
# so the values never sit in the container environment (see config.py._secret).
#
#   SECRET_KEY=$(openssl rand -hex 32) POSTGRES_PASSWORD=$(openssl rand -hex 16) \
#     docker compose -f docker-compose.prod.yml up --build
#
# then open http://localhost:8080. Demo data is never seeded automatically; run
#   docker compose -f docker-compose.prod.yml exec backend flask --app app seed-demo
# (or seed-demo-data) once the stack is healthy.
#
# A distinct project name so the prod images/containers never collide with the
# dev stack's (docker-compose.yml), which would otherwise share the same names
# and silently reuse each other's images.
name: ems-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ems}
      POSTGRES_USER: ${POSTGRES_USER:-ems}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ems} -d ${POSTGRES_DB:-ems}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      EMS_ENV: production
      # Required in production — the app refuses to start without a real key.
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY, e.g. openssl rand -hex 32}
      # PostgreSQL (psycopg 3). The migrations run against it on startup.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ems}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ems}
      # Secure (HTTPS-only) cookies by default; set 0 to smoke-test over HTTP.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
